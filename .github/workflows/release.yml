name: Native releases

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.event_name == 'push' && 'dev' || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  QREDO_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || 'dev' }}
  QREDO_RELEASE_ID: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
      - uses: Swatinem/rust-cache@v2
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"
      - run: bash scripts/check

  build:
    if: github.event_name != 'pull_request'
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-windows
            rust_targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-pc-windows-gnu
            targets: x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-pc-windows-gnu
            cross: true
          - os: macos-15
            name: macos
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            targets: aarch64-apple-darwin x86_64-apple-darwin
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - uses: taiki-e/install-action@cross
        if: matrix.cross
      - name: Build and package native executables
        shell: bash
        run: bash scripts/build-release-targets dist $TARGETS
        env:
          TARGETS: ${{ matrix.targets }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}
          path: dist/qredo-*
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          test "$(find dist -maxdepth 1 -type f -name 'qredo-*' | wc -l)" -eq 5
          (cd dist && sha256sum qredo-* > SHA256SUMS)
      - name: Replace rolling dev release
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/dev" || true
          gh release create dev dist/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "qredo dev (${GITHUB_SHA::7})" \
            --notes "Rolling development build for commit $GITHUB_SHA. Assets are replaced by every push to main."
      - name: Verify stable release version
        if: github.event_name == 'release'
        run: bash scripts/check-release-version "$QREDO_RELEASE_TAG"
      - name: Upload stable release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$QREDO_RELEASE_TAG" dist/* --clobber
      - name: Mark stable release as latest
        if: github.event_name == 'release' && !github.event.release.prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$QREDO_RELEASE_TAG" --latest
      - uses: erlef/setup-beam@v1
        if: github.event_name == 'release' && !github.event.release.prerelease
        with:
          otp-version: "27"
          elixir-version: "1.17"
      - name: Publish Mix package to Hex
        if: github.event_name == 'release' && !github.event.release.prerelease
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          test -n "$HEX_API_KEY" || { echo 'HEX_API_KEY secret is required' >&2; exit 1; }
          mix local.hex --force
          mix deps.get
          mix hex.publish --yes
