[package]
name = "qredo"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT"
description = "Native Elixir linting compatible with Credo: rule kernels, pipeline runner and CLI"
repository = "https://github.com/qredo/qredo"
keywords = ["elixir", "credo", "lint", "static-analysis"]
categories = ["development-tools"]

[[bin]]
name = "qredo"
path = "src/main.rs"

[lib]
name = "qredo"
path = "src/lib.rs"

[dependencies]
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tree-sitter = "0.27"
tree-sitter-elixir = "0.3.5"
hotpath = { version = "0.25", optional = true }

[features]
hotpath = ["dep:hotpath", "hotpath/hotpath"]

[lints]
workspace = true
